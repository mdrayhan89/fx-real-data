<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Trading Chart</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .chart-wrapper {
      position: relative; width: 99vw; height: 98vh;
      background: #000000; border: 2px solid #5a422d; border-radius: 4px;
      padding: 2px; overflow: hidden;
    }
    .inner-border {
      position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
      border: 1px solid rgba(138, 98, 62, 0.4); pointer-events: none; z-index: 10;
    }
    .brand-header {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 20; text-align: center; pointer-events: none;
    }
    .brand-crowns { color: #d4af37; font-size: 11px; letter-spacing: 2px; }
    .brand-title { color: #e5c158; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    .pair-badge {
      position: absolute; top: 10px; left: 12px; z-index: 20;
      background: rgba(20, 20, 20, 0.95); border: 1px solid #333;
      padding: 4px 10px; border-radius: 3px; font-size: 11px; font-weight: 700; color: #fff;
    }
    #chartArea { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="chart-wrapper">
    <div class="inner-border"></div>
    <div class="pair-badge" id="pairDisplay">5 USD/JPY</div>
    
    <div class="brand-header">
      <div class="brand-crowns">♔ ♔ ♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>

    <div id="chartArea"></div>
  </div>

<script>
  const UTC6_OFFSET = 6 * 3600;

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    return (urlParams.get('pair') || 'USD/JPY').toUpperCase();
  }

  const currentPair = getSelectedPair();
  document.getElementById('pairDisplay').innerText = `5 ${currentPair}`;

  const container = document.getElementById('chartArea');
  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: { backgroundColor: '#000000', textColor: '#888888' },
    grid: { vertLines: { color: 'rgba(255, 255, 255, 0.03)' }, horzLines: { color: 'rgba(255, 255, 255, 0.03)' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#222222', visible: true },
    timeScale: { 
      borderColor: '#222222', 
      timeVisible: true, 
      secondsVisible: false,
      rightOffset: 5,
      barSpacing: 18, // Fixed Zoom Level matching 1st Picture
      tickMarkFormatter: (time) => {
        const date = new Date((time + UTC6_OFFSET) * 1000);
        const hours = String(date.getUTCHours()).padStart(2, '0');
        const minutes = String(date.getUTCMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#00e676', downColor: '#ff1744',
    borderUpColor: '#00e676', borderDownColor: '#ff1744',
    wickUpColor: '#00e676', wickDownColor: '#ff1744'
  });

  async function loadData() {
    try {
      const res = await fetch(`/api/candles?pair=${encodeURIComponent(currentPair)}`);
      const result = await res.json();

      if (result.data && result.data.length > 0) {
        const formatted = result.data.slice().reverse().map(item => ({
          time: item.timestamp,
          open: item.open,
          high: item.high,
          low: item.low,
          close: item.close
        }));

        candleSeries.setData(formatted);
      }
    } catch (e) {
      console.error("Data error", e);
    }
  }

  loadData();
  setInterval(loadData, 3000);

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
</script>
</body>
</html>
