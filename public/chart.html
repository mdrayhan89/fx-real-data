<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET TradingView Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Gold/Bronze Border Frame */
    .chart-wrapper {
      position: relative;
      width: 99vw;
      height: 98vh;
      background-color: #000000;
      border: 2px solid #5a422d;
      border-radius: 4px;
      padding: 1px;
      overflow: hidden;
    }

    /* Inner Thin Border Line */
    .inner-border {
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      border: 1px solid rgba(138, 98, 62, 0.4);
      pointer-events: none;
      z-index: 100;
    }

    /* Header Brand Title */
    .brand-header {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      text-align: center;
      pointer-events: none;
    }
    .brand-crowns {
      color: #d4af37;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .brand-title {
      color: #e5c158;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 5px rgba(229, 193, 88, 0.4);
    }

    /* Pair Badge Top Left */
    .pair-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 101;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* Container Technique to Hide Bottom TradingView Logo */
    .widget-crop-box {
      width: 100%;
      height: calc(100% + 36px); /* Pushes bottom logo outside boundary */
      margin-top: -2px;
      position: relative;
      overflow: hidden;
    }

    iframe {
      border: none !important;
    }
  </style>
</head>
<body>

  <div class="chart-wrapper">
    <div class="inner-border"></div>
    
    <!-- Top Left Pair Display -->
    <div class="pair-badge" id="pairName">5 USD/JPY</div>

    <!-- Top Center Dark Secret Brand Header -->
    <div class="brand-header">
      <div class="brand-crowns">♔ ♔ ♔</div>
      <div class="brand-title">DARK SECRET</div>
    </div>

    <!-- Direct TradingView Advanced Chart Widget -->
    <div class="widget-crop-box">
      <div id="tradingview_chart" style="width: 100%; height: 100%;"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
        function getSymbolFromUrl() {
          const params = new URLSearchParams(window.location.search);
          let pair = params.get('pair') || 'USD/JPY';
          pair = pair.toUpperCase().replace('/', '');
          return "FX:" + pair;
        }

        function getPairDisplayText() {
          const params = new URLSearchParams(window.location.search);
          let pair = params.get('pair') || 'USD/JPY';
          return "5 " + pair.toUpperCase();
        }

        document.getElementById('pairName').innerText = getPairDisplayText();

        new TradingView.widget({
          "autosize": true,
          "symbol": getSymbolFromUrl(),
          "interval": "1",
          "timezone": "Asia/Dhaka",
          "theme": "dark",
          "style": "1",
          "locale": "en",
          "toolbar_bg": "#000000",
          "enable_publishing": false,
          "hide_top_toolbar": true,
          "hide_legend": true,
          "save_image": false,
          "backgroundColor": "#000000",
          "gridColor": "rgba(255, 255, 255, 0.03)",
          "container_id": "tradingview_chart",
          "disabled_features": [
            "header_widget",
            "left_toolbar",
            "control_bar",
            "timeframes_toolbar",
            "display_market_status",
            "volume_force_overlay",
            "create_volume_indicator_by_default"
          ],
          "enabled_features": [],
          "overrides": {
            "mainSeriesProperties.style": 1,
            "mainSeriesProperties.candleStyle.upColor": "#00e676",
            "mainSeriesProperties.candleStyle.borderUpColor": "#00e676",
            "mainSeriesProperties.candleStyle.wickUpColor": "#00e676",
            "mainSeriesProperties.candleStyle.downColor": "#ff1744",
            "mainSeriesProperties.candleStyle.borderDownColor": "#ff1744",
            "mainSeriesProperties.candleStyle.wickDownColor": "#ff1744",
            "paneProperties.background": "#000000",
            "paneProperties.vertGridProperties.color": "rgba(255, 255, 255, 0.03)",
            "paneProperties.horzGridProperties.color": "rgba(255, 255, 255, 0.03)",
            "scalesProperties.textColor": "#888888"
          }
        });
      </script>
    </div>
  </div>

</body>
</html>
