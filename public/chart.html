<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK SECRET Real Forex Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .chart-frame {
      position: relative; width: 98vw; height: 95vh;
      background: #000000; border: 2px solid #b3875a; border-radius: 6px;
      box-shadow: 0 0 25px rgba(179, 135, 90, 0.25); padding: 8px;
    }
    .inner-border {
      position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(179, 135, 90, 0.3); pointer-events: none; z-index: 5;
    }
    .header-logo {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none;
    }
    .crown-icon { color: #d4af37; font-size: 13px; letter-spacing: 3px; }
    .brand-title { color: #e5c158; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    
    .status-badge {
      font-size: 10px; font-weight: bold; margin-top: 2px; padding: 2px 8px;
      border-radius: 3px; display: inline-block;
    }
    .status-open { background: rgba(67, 160, 71, 0.2); color: #43a047; border: 1px solid #43a047; }
    .status-closed { background: rgba(229, 57, 53, 0.2); color: #e53935; border: 1px solid #e53935; }

    .pair-badge {
      position: absolute; top: 12px; left: 15px; z-index: 10;
      background: rgba(20, 20, 20, 0.9); border: 1px solid #333;
      padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff;
    }
    #tv_chart_container {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0; z-index: 1;
    }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div class="chart-frame">
    <div class="inner-border"></div>
    <div class="pair-badge" id="pairDisplay">6 USDJPY</div>
    
    <div class="header-logo">
      <div class="crown-icon">♔♔♔</div>
      <div class="brand-title">DARK SECRET</div>
      <div class="status-badge status-closed" id="marketStatus">MARKET CLOSED</div>
    </div>
    
    <div id="tv_chart_container"></div>
  </div>

<script>
  // Pair Mapping Dictionary
  const PAIR_MAP = {
    'EUR/USD': 'FX:EURUSD', 'EURUSD': 'FX:EURUSD',
    'USD/JPY': 'FX:USDJPY', 'USDJPY': 'FX:USDJPY',
    'CAD/JPY': 'FX:CADJPY', 'CADJPY': 'FX:CADJPY',
    'AUD/CAD': 'FX:AUDCAD', 'AUDCAD': 'FX:AUDCAD',
    'GBP/USD': 'FX:GBPUSD', 'GBPUSD': 'FX:GBPUSD',
    'EUR/JPY': 'FX:EURJPY', 'EURJPY': 'FX:EURJPY',
    'AUD/JPY': 'FX:AUDJPY', 'AUDJPY': 'FX:AUDJPY',
    'AUD/USD': 'FX:AUDUSD', 'AUDUSD': 'FX:AUDUSD',
    'EUR/GBP': 'FX:EURGBP', 'EURGBP': 'FX:EURGBP',
    'AUD/CHF': 'FX:AUDCHF', 'AUDCHF': 'FX:AUDCHF',
    'EUR/CAD': 'FX:EURCAD', 'EURCAD': 'FX:EURCAD',
    'GBP/CAD': 'FX:GBPCAD', 'GBPCAD': 'FX:GBPCAD'
  };

  function getSelectedPair() {
    const urlParams = new URLSearchParams(window.location.search);
    const raw = (urlParams.get('pair') || 'USD/JPY').toUpperCase().trim();
    return raw;
  }

  const currentPair = getSelectedPair();
  const formattedSymbol = PAIR_MAP[currentPair] || 'FX:USDJPY';
  
  // Badge text display
  const cleanBadgeText = currentPair.replace('/', '');
  document.getElementById('pairDisplay').innerText = `6 ${cleanBadgeText}`;

  function checkMarketOpen() {
    const now = new Date();
    const day = now.getUTCDay();
    const hour = now.getUTCHours();
    if (day === 6) return false;
    if (day === 5 && hour >= 21) return false;
    if (day === 0 && hour < 21) return false;
    return true;
  }

  const statusBadge = document.getElementById('marketStatus');
  if (checkMarketOpen()) {
    statusBadge.innerText = "MARKET OPEN";
    statusBadge.className = "status-badge status-open";
  } else {
    statusBadge.innerText = "MARKET CLOSED";
    statusBadge.className = "status-badge status-closed";
  }

  new TradingView.widget({
    "autosize": true,
    "symbol": formattedSymbol,
    "interval": "1",
    "timezone": "Asia/Dhaka",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#000000",
    "enable_publishing": false,
    "hide_top_toolbar": true,
    "hide_legend": true,
    "save_image": false,
    "container_id": "tv_chart_container",
    "overrides": {
      "paneProperties.background": "#000000",
      "paneProperties.vertGridProperties.color": "rgba(255, 255, 255, 0.04)",
      "paneProperties.horzGridProperties.color": "rgba(255, 255, 255, 0.04)",
      "symbolWatermarkProperties.transparency": 100,
      "scalesProperties.textColor": "#888888"
    }
  });
</script>
</body>
</html>
